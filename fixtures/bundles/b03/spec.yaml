version: spec-v3
destinations:
- manual_review
- priority_queue
- escalation
- normal_queue
units:
  wait: hours
default: normal_queue
rules:
- id: S1
  order: 1
  refs:
  - R1
  when:
    field: category
    op: is_missing
  route: manual_review
- id: S2
  order: 2
  refs:
  - R2
  when:
    all:
    - field: urgent
      op: eq
      value: true
    - not:
        field: category
        op: eq
        value: spam
  route: priority_queue
- id: S3
  order: 3
  refs:
  - R3
  when:
    not:
      field: wait
      op: lt
      value: 0.5
  route: escalation
  exceptions:
  - order: 1
    when:
      field: tier
      op: eq
      value: vip
    action:
      route: priority_queue
