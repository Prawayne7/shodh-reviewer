version: spec-v3
destinations:
- manual_review
- priority_queue
- escalation
- normal_queue
units:
  wait: minutes
default: normal_queue
rules:
- id: rule-urgent
  order: 2
  refs:
  - POL-B
  when:
    field: urgent
    op: eq
    value: true
  route: priority_queue
  exceptions:
  - order: 1
    when:
      field: category
      op: eq
      value: spam
    action: skip
- id: rule-wait
  order: 3
  refs:
  - POL-C
  when:
    field: wait
    op: ge
    value: 30
  route: escalation
  exceptions:
  - order: 1
    when:
      field: tier
      op: eq
      value: vip
    action:
      route: priority_queue
- id: rule-missing
  order: 1
  refs:
  - POL-A
  when:
    field: category
    op: is_missing
  route: manual_review
