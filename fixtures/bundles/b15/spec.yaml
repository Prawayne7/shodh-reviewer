version: spec-v3
destinations:
- manual_review
- priority_queue
- escalation
- normal_queue
units:
  wait: minutes
default: normal_queue
rules:
- id: S1
  order: 1
  refs:
  - R1
  when:
    field: category
    op: is_missing
  route: manual_review
- id: S2
  order: 2
  refs:
  - R2
  when:
    field: urgent
    op: eq
    value: true
  route: priority_queue
  exceptions:
  - order: 1
    when:
      field: category
      op: eq
      value: spam
    action: skip
- id: S3
  order: 3
  refs:
  - R3
  when:
    field: wait
    op: ge
    value: 30
  route: escalation
  exceptions:
  - order: 1
    when:
      all:
      - field: tier
        op: eq
        value: vip
      - field: urgent
        op: eq
        value: false
    action:
      route: priority_queue
